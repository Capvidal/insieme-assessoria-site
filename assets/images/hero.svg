<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="Ilustração representando pessoas trabalhando juntas com apoio de tecnologia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2540"/>
      <stop offset="100%" stop-color="#114b5f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="480" rx="16" fill="url(#bg)"/>

  <!-- Linhas de circuito discretas ao fundo, remetendo a tecnologia -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <path d="M 40 60 h 90 v 40"/>
    <path d="M 480 50 h -70 v 60"/>
    <path d="M 60 420 h 80 v -50"/>
    <path d="M 520 400 h -90 v -40"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.12">
    <circle cx="130" cy="100" r="3.5"/>
    <circle cx="410" cy="110" r="3.5"/>
    <circle cx="140" cy="370" r="3.5"/>
    <circle cx="430" cy="360" r="3.5"/>
  </g>

  <!-- Mesa de trabalho -->
  <ellipse cx="300" cy="360" rx="220" ry="26" fill="#0a1f36"/>
  <rect x="90" y="330" width="420" height="16" rx="8" fill="#16344a"/>

  <!-- Monitor com painel/gráfico, representando tecnologia -->
  <g>
    <rect x="255" y="230" width="120" height="86" rx="6" fill="#16344a" stroke="#2fb8a4" stroke-width="2"/>
    <rect x="264" y="240" width="102" height="58" rx="3" fill="#0b2540"/>
    <polyline points="272,286 292,268 308,278 326,254 348,264 360,246" fill="none" stroke="#7fd9cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="305" y="316" width="30" height="10" fill="#16344a"/>
    <rect x="288" y="326" width="64" height="6" rx="3" fill="#0a1f36"/>
  </g>

  <!-- Pessoa 1 (esquerda), sentada, apoiada na mesa -->
  <g>
    <circle cx="175" cy="238" r="24" fill="#e7ebee"/>
    <path d="M 130 335 C 130 280 150 262 175 262 C 200 262 220 280 220 335 Z" fill="#e7ebee"/>
    <path d="M 150 330 C 158 312 182 308 200 322 L 196 336 C 180 326 162 328 154 340 Z" fill="#f5f7f9"/>
  </g>

  <!-- Pessoa 2 (direita), sentada, apoiada na mesa -->
  <g>
    <circle cx="425" cy="238" r="24" fill="#cfe3ea"/>
    <path d="M 380 335 C 380 280 400 262 425 262 C 450 262 470 280 470 335 Z" fill="#cfe3ea"/>
    <path d="M 400 322 C 418 308 442 312 450 330 L 446 340 C 438 328 420 326 404 336 Z" fill="#e7ebee"/>
  </g>

  <!-- Linhas de conexão entre as pessoas e o monitor, reforçando colaboração -->
  <g stroke="#2fb8a4" stroke-width="2" stroke-opacity="0.8" fill="none">
    <path d="M 210 300 Q 260 320 258 300"/>
    <path d="M 390 300 Q 340 320 342 300"/>
  </g>
  <g fill="#2fb8a4">
    <circle cx="210" cy="300" r="4"/>
    <circle cx="390" cy="300" r="4"/>
  </g>
</svg>
